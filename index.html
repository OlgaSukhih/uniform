<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Uniforms Around the World</title><style>
:root{--ink:#25394b;--blue:#315b76;--cream:#f7f5f0;--line:#d8e2e7;--light:#eaf2f5}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:20px/1.6 system-ui,Segoe UI,sans-serif}.wrap{max-width:930px;margin:auto;padding:22px}header{background:#243e56;color:white;padding:42px 24px;border-radius:0 0 25px 25px}h1{font:700 clamp(32px,5vw,51px)/1.18 Georgia,serif;margin:0}h2{font:700 32px Georgia,serif;margin:0 0 12px}h3{font-size:23px;margin:20px 0 10px}.sub{opacity:.84;margin:12px 0 0}.story{background:white;border:1px solid var(--line);border-radius:23px;padding:28px;margin:24px 0 36px;box-shadow:0 5px 20px #21394b0b}.country{color:var(--blue);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.09em}.task{border-top:1px solid var(--line);padding-top:18px;margin-top:23px}.taskname{font-size:24px;font-weight:750;margin:0 0 6px}.hint{color:#597185;margin:0 0 15px;font-size:18px}.q{background:#f6f9fa;border:1px solid #e1e9ed;border-radius:14px;padding:15px 18px;margin:13px 0}.q p{margin:0 0 9px;font-weight:650}.choice{display:block;margin:8px 0;cursor:pointer}.choice input{width:19px;height:19px;accent-color:var(--blue);margin-right:9px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:17px 0}button{font:650 17px system-ui;border:0;border-radius:12px;padding:12px 18px;background:var(--blue);color:white;cursor:pointer}button.secondary{background:var(--light);color:var(--ink)}button:hover{filter:brightness(.94)}.feedback{font-weight:700;color:#2c6457;min-height:26px}.transcript{background:#f1f5f7;border-left:4px solid #7898ab;border-radius:8px;padding:18px;line-height:1.8}.follow{padding-left:26px}.follow li{padding:5px 0}.support{background:#f8f1e6;border-radius:12px;padding:15px 18px;font-size:18px}.support b{color:#72512d}footer{padding:18px 0 40px;color:#637585;font-size:15px}@media(max-width:600px){body{font-size:19px}.wrap{padding:12px}header{padding:32px 18px}.story{padding:18px 16px;border-radius:16px}h2{font-size:28px}.taskname{font-size:22px}button{width:100%}}
</style></head><body><header><div class="wrap"><h1>School Uniforms Around the World</h1><p class="sub">Five students · Five different perspectives</p></div></header><main class="wrap"><div id="stories"></div><footer>These are fictional student accounts inspired by real school-uniform practices. Rules differ between schools. Audio uses the voices available on your device.</footer></main><script>
const speakers=[{country:'Japan',name:'Haruka',voice:'en-GB',text:`I'm Haruka, and I'm sixteen. I go to a high school in Tokyo where our uniform is quite traditional: a dark blazer, a white shirt, a pleated skirt or trousers, and a tie in the school's colours. When I was younger, I imagined that wearing a uniform would make school feel like something out of a television drama. In reality, it's mostly just what I put on every morning without thinking. Some Japanese schools still have sailor-style uniforms, but ours doesn't. The rules at my school also cover things like jewellery and hair colour, although they aren't quite as strict as the rules my older sister remembers. I actually like how easy it is to get dressed. What bothers me is the assumption that every student should look exactly the same. Our student council recently asked whether we could have more flexible options in summer, because Tokyo gets incredibly hot. For me, the question isn't whether uniforms should disappear. It's whether traditions can change when students' needs change.`,qs:[['What does Haruka say about sailor-style uniforms?',['Every Japanese school requires them.','Some schools have them, but hers does not.','They are worn only in summer.'],1],['What change has the student council suggested?',['More comfortable summer options.','A new school badge.','Removing all rules about jewellery.'],0],['What is Haruka’s overall view?',['Traditions should never change.','Uniforms should be banned nationwide.','Uniforms can stay, but rules should adapt.'],2]]},{country:'United Kingdom',name:'Oliver',voice:'en-GB',text:`I'm Oliver, I'm seventeen, and I attend a secondary school in England. We have to wear a navy blazer with the school badge, a shirt, a tie and dark trousers or a skirt. There's even a specific rule about shoes: plain black leather-style shoes, not trainers. My little brother once got told off because his shoes had a tiny white logo. What annoys my parents most, though, is the cost. You can buy some basic items from ordinary shops, but the branded blazer and PE kit have to match the school's requirements. Those items can be expensive, especially if you have more than one child. Teachers say the uniform creates a professional atmosphere, and I understand that. But I don't think wearing a tie automatically makes anyone work harder. Last year, students asked for a more affordable uniform policy, and the school started looking at second-hand options. That seems like a sensible compromise. I don't mind wearing a uniform; I just think the rules should be fair and affordable.`,qs:[['Why was Oliver’s brother told off?',['His shirt was untucked.','His shoes had a small white logo.','He forgot his tie.'],1],['What is Oliver’s main criticism?',['Uniforms are too colourful.','Students cannot wear coats.','Some compulsory items are expensive.'],2],['Which change does Oliver welcome?',['Second-hand uniform options.','Replacing lessons with sports.','A compulsory new tie.'],0]]},{country:'India',name:'Ananya',voice:'en-IN',text:`My name's Ananya, and I'm sixteen. I live in Pune, India, and my school has a regular uniform for most days and a different outfit for PE days. Usually I wear a light-coloured shirt with dark trousers and an ID card on a lanyard. At my school, students can choose trousers rather than a skirt, which I appreciate because I cycle part of the way to school. A lot of schools in India use uniforms, but the colours and rules vary enormously. At some schools, girls wear a salwar kameez, while others have shirts, skirts or trousers. During the monsoon, the practical details matter much more than the appearance. If you arrive after a heavy shower, your shoes and socks may be soaked before the first lesson even begins. Our school has become more understanding about suitable rain footwear on especially wet days. I like the idea that everyone starts the day looking similar, but I wish schools would pay even more attention to how students actually travel and what the weather is like.`,qs:[['Why does Ananya prefer trousers?',['They are cheaper than skirts.','They are convenient for cycling.','They are compulsory for everyone.'],1],['What does she emphasise about Indian uniforms?',['Every school uses the same design.','Uniforms are unusual in India.','Designs and rules vary by school.'],2],['What practical problem does she describe?',['Getting wet during the monsoon.','Extreme winter snow.','Having no PE clothes.'],0]]},{country:'South Korea',name:'Min-jun',voice:'en-GB',text:`I'm Min-jun, a sixteen-year-old student in Seoul. At my school, the standard uniform includes a jacket, shirt, tie and trousers or skirt, but we also have a much more comfortable everyday uniform that looks a bit like sportswear. Students sometimes call this a lifestyle uniform. I usually choose it whenever the school timetable allows, especially on days when we have lots of moving between classrooms. Korean school uniforms have a very recognisable image, partly because you see them in television dramas. But actual rules depend on the school, and they're not all as strict as people imagine. My parents say uniforms used to feel more formal when they were students. These days, students often argue for comfort, sensible prices and more choice. I like having a uniform because I don't have to plan an outfit every morning. Still, if the purpose is to help us study, it makes sense to let us wear something we can sit in comfortably for hours.`,qs:[['What is a lifestyle uniform in Min-jun’s school?',['A more comfortable alternative to formal uniform.','Clothing worn only at graduation.','A costume used in school plays.'],0],['What shapes some people’s image of Korean uniforms?',['National sports competitions.','Television dramas.','School lunches.'],1],['Which argument does Min-jun support?',['Students should dress formally at all times.','Uniforms should be identical across Korea.','Comfort matters during a long school day.'],2]]},{country:'Australia',name:'Sophie',voice:'en-AU',text:`I'm Sophie, and I'm seventeen. I live in Brisbane, Australia, where summer can be seriously hot. My school has a uniform, but it's designed with the climate in mind. We have a lightweight polo shirt and shorts or a skirt for everyday wear, as well as a more formal uniform for certain events. One of the things visitors notice is how seriously our school takes sun protection. We are expected to wear a suitable hat for outdoor activities, and sunscreen is strongly encouraged. Different Australian schools have different rules, of course; some are much more formal than ours. I used to think the hat rule was a bit childish, but after spending an afternoon outside during a school sports event, I understood why it mattered. I actually find the uniform practical. My only complaint is that some fabrics don't breathe as well as they should. If schools want students to follow a dress code, they need to make sure it works in the real weather, not just in photographs.`,qs:[['Why does Sophie mention hats?',['They show which year group students belong to.','They are part of sun protection.','They are worn only during exams.'],1],['When does Sophie’s school use a more formal uniform?',['At certain events.','Every afternoon.','Only in winter.'],0],['What is her main complaint?',['The colours are too bright.','Students cannot wear shorts.','Some fabrics are not breathable enough.'],2]]}];

const gist=[
{q:'What is Haruka’s main point?',a:['School uniforms should be more fashionable.','Schools can keep traditions but should listen to students.','Japanese students never like uniforms.'],correct:1},
{q:'What is Oliver mainly concerned about?',a:['The price and fairness of uniform rules.','The colour of his school uniform.','The lack of sports lessons.'],correct:0},
{q:'What matters most to Ananya?',a:['Having the same uniform as every school.','Wearing formal clothes every day.','Choosing clothes that suit travel and the weather.'],correct:2},
{q:'What is Min-jun’s main opinion?',a:['Comfortable uniforms make sense for everyday school life.','All students should wear ties.','School uniforms should be banned.'],correct:0},
{q:'What is Sophie’s main message?',a:['Uniforms should look good in photos.','School clothes should be practical in hot weather.','Hats should never be compulsory.'],correct:1}
];
const follow=[
['Would you prefer a traditional uniform or more choice? Why?','Should students be able to suggest changes to school rules?','What uniform rule would you change first?'],
['Do you think school uniforms are worth the money?','Should schools allow cheaper alternatives to branded clothes?','Would a uniform make students feel more equal? Why / why not?'],
['How does the weather affect what students wear in your country?','Should students be allowed to wear trousers instead of skirts?','What is more important: looking smart or feeling comfortable?'],
['Would you choose a formal uniform or a sports-style uniform?','Can comfortable clothes help students concentrate?','Do films and TV shows give us a realistic idea of school life?'],
['Should schools have special rules for hot or sunny weather?','Would you be happy to wear a school hat outside?','What would your ideal summer school uniform look like?']
];
const supports=[
'I can see both sides, but… · I would prefer… because… · Students should have a say in…',
'The biggest problem is… · It seems unfair that… · One possible solution would be…',
'In my experience… · It depends on… · Schools should take … into account.',
'I would rather wear… · The advantage of … is… · I partly agree because…',
'In hot weather… · It makes sense to… · I would change…'
];
let current=null;function stopAudio(){if('speechSynthesis' in window) speechSynthesis.cancel()}
function listen(i){stopAudio();if(!('speechSynthesis' in window)){alert('Speech is not supported in this browser.');return}let s=speakers[i],u=new SpeechSynthesisUtterance(s.text);u.lang=s.voice;u.rate=.88;let vs=speechSynthesis.getVoices(),v=vs.find(v=>v.lang.toLowerCase()===s.voice.toLowerCase())||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;current=u;speechSynthesis.speak(u)}
function choices(i,kind,q,opts){return `<div class="q"><p>${q}</p>${opts.map((x,j)=>`<label class="choice"><input type="radio" name="${kind}${i}" value="${j}">${x}</label>`).join('')}</div>`}
const root=document.getElementById('stories');speakers.forEach((s,i)=>{root.insertAdjacentHTML('beforeend',`<section class="story"><div class="country">Recording ${i+1} · ${s.country}</div><h2>${s.name}</h2><div class="actions"><button onclick="listen(${i})">▶ Listen</button><button class="secondary" onclick="stopAudio()">■ Stop</button><button class="secondary" onclick="document.getElementById('trans${i}').hidden=!document.getElementById('trans${i}').hidden">Show / hide transcript</button></div><div class="transcript" id="trans${i}" hidden>${s.text}</div><div class="task"><div class="taskname">1. Gist listening</div><p class="hint">Listen once. Choose the best answer.</p>${choices(i,'gist',gist[i].q,gist[i].a)}<button onclick="check(${i},'gist')">Check answer</button><p class="feedback" id="gistfb${i}" aria-live="polite"></p></div><div class="task"><div class="taskname">2. Detailed listening</div><p class="hint">Listen again. Choose the correct answers.</p>${s.qs.map((q,j)=>`<div class="q"><p>${j+1}. ${q[0]}</p>${q[1].map((x,k)=>`<label class="choice"><input type="radio" name="detail${i}_${j}" value="${k}">${x}</label>`).join('')}</div>`).join('')}<button onclick="check(${i},'detail')">Check answers</button><p class="feedback" id="detailfb${i}" aria-live="polite"></p></div><div class="task"><div class="taskname">3. Follow-up questions</div><p class="hint">Discuss. Give reasons and examples.</p><ol class="follow">${follow[i].map(x=>`<li>${x}</li>`).join('')}</ol><div class="support"><b>Useful language</b><div>${supports[i]}</div></div></div></section>`)});
function selected(name){let el=document.querySelector(`input[name="${name}"]:checked`);return el?+el.value:null}
function check(i,kind){let fb=document.getElementById(kind+'fb'+i);if(kind==='gist'){let v=selected('gist'+i);fb.textContent=v===null?'Choose an answer first.':v===gist[i].correct?'Correct! Well done.':'Not quite. Listen again and try once more.';return}let answered=0,score=0;speakers[i].qs.forEach((q,j)=>{let v=selected(`detail${i}_${j}`);if(v!==null){answered++;if(v===q[2])score++}});fb.textContent=answered<3?'Answer all three questions first.':`${score} / 3 correct. ${score===3?'Excellent!':'Listen again and try to improve your score.'}`}
</script></body></html>
